services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: movie-dw-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Luandz25032005}"
      MSSQL_PID: "Developer"
    ports:
      - "${DOCKER_PORT:-14333}:1433"
    volumes:
      - mssql_dw_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD:-Luandz25032005} -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mssql_dw_data:
    driver: local
